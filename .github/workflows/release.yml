name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - name: Read version and determine tag
        run: |
          version=$(sed -nE 's/^\s*versionName = "(.*)"/\1/p' app/build.gradle.kts)
          if [ -z "$version" ]; then
            echo "::error::Cannot read versionName from app/build.gradle.kts"
            exit 1
          fi
          if [ "${{ github.event_name }}" = "push" ]; then
            tag="${{ github.ref_name }}"
            if [ "v$version" != "$tag" ]; then
              echo "::error::Tag $tag does not match versionName \"$version\""
              exit 1
            fi
          else
            tag="v$version"
          fi
          echo "VERSION=$version" >> "$GITHUB_ENV"
          echo "TAG=$tag" >> "$GITHUB_ENV"

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      # Use a stable self-contained debug-style signing key so released APKs are installable.
      - name: Restore or create signing key
        id: signing
        env:
          KEYSTORE_BASE64: ${{ secrets.MYDRAWER_KEYSTORE_BASE64 }}
          SECRET_PASSWORD: ${{ secrets.MYDRAWER_STORE_PASSWORD }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/release.jks"
            echo "password=$SECRET_PASSWORD" >> "$GITHUB_OUTPUT"
          else
            keytool -genkeypair -v \
              -keystore "$RUNNER_TEMP/release.jks" \
              -alias mydrawer -keyalg RSA -keysize 2048 -validity 10000 \
              -storepass mydrawer -keypass mydrawer \
              -dname "CN=MyDrawer, OU=Personal, O=Personal, L=CN, ST=CN, C=CN"
            echo "password=mydrawer" >> "$GITHUB_OUTPUT"
          fi

      - name: Test and build signed release
        env:
          MYDRAWER_STORE_FILE: ${{ runner.temp }}/release.jks
          MYDRAWER_STORE_PASSWORD: ${{ steps.signing.outputs.password }}
          MYDRAWER_KEY_ALIAS: mydrawer
          MYDRAWER_KEY_PASSWORD: ${{ steps.signing.outputs.password }}
        run: ./gradlew testDebugUnitTest assembleRelease

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT: ${{ github.event_name }}
        run: |
          out=app/build/outputs/apk/release
          dist="$RUNNER_TEMP/dist"
          mkdir -p "$dist"
          cp "$out/app-arm64-v8a-release.apk"   "$dist/MyDrawer-$VERSION-arm64-v8a.apk"
          cp "$out/app-armeabi-v7a-release.apk" "$dist/MyDrawer-$VERSION-armeabi-v7a.apk"
          cp "$out/app-universal-release.apk"   "$dist/MyDrawer-$VERSION-universal.apk"
          (cd "$dist" && sha256sum *.apk > SHA256SUMS)
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" "$dist"/* --clobber
          else
            args=(--title "MyDrawer $VERSION" --generate-notes)
            if [ "$EVENT" = "push" ]; then args+=(--verify-tag); fi
            gh release create "$TAG" "$dist"/* "${args[@]}"
          fi

      - name: Remove signing key
        if: always()
        run: rm -f "$RUNNER_TEMP/release.jks"
